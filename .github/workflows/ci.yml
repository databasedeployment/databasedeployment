name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # DPAPI and LocalDB are Windows-only, so CI runs on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SchemaDiff.sln

      - name: Build
        run: dotnet build SchemaDiff.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test SchemaDiff.sln --no-build --configuration Release --collect "XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
